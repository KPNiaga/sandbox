<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Penetapan Harga Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- ==================== SKRIN LOG MASUK ==================== -->
  <div id="loginSection" class="flex min-h-screen items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md border border-slate-200">
      <h2 class="text-2xl font-bold text-center mb-6 text-slate-800">Log Masuk Panel</h2>
      <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-xs font-medium"></div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Emel</label>
          <input type="email" id="emailInput" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="nama@organisasi.my" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Kata Laluan</label>
          <div class="relative">
            <input type="password" id="passwordInput" class="w-full border rounded-lg p-2.5 pr-10 text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••" />
            <button type="button" id="btnTogglePassword" onclick="window.togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 select-none cursor-pointer">
              <span id="eyeIcon">👁️</span>
            </button>
          </div>
        </div>
        <button type="button" id="btnLogin" onclick="window.handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition cursor-pointer text-sm shadow">Log Masuk</button>
      </div>
    </div>
  </div>

  <!-- ==================== SKRIN UTAMA DASHBOARD ==================== -->
  <div id="dashboardSection" class="hidden min-h-screen flex flex-col">
    <header class="bg-white border-b px-6 py-4 flex justify-between items-center shadow-sm sticky top-0 z-30">
      <h1 class="text-lg font-bold text-slate-800">Portal Konsensus Penetapan Harga SKU</h1>
      <div class="flex items-center gap-3">
        <span id="userBadge" class="text-xs bg-slate-100 text-slate-700 px-3 py-1.5 rounded-full font-medium border"></span>
        <button type="button" onclick="window.handleLogout()" class="text-xs bg-red-50 text-red-600 border border-red-200 px-3 py-1.5 rounded-lg hover:bg-red-100 transition font-medium cursor-pointer">Log Keluar</button>
      </div>
    </header>

    <main class="flex-1 p-6 max-w-[1550px] mx-auto w-full space-y-6">
      <!-- Pilihan Syarikat & Status Kadar Gudang -->
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <label for="companySelect" class="text-sm font-bold text-slate-700">Pilih Syarikat:</label>
          <select id="companySelect" onchange="window.onCompanySelectChange()" class="border rounded-xl p-2.5 text-sm min-w-[280px] bg-slate-50 outline-none focus:ring-2 focus:ring-blue-500 font-medium">
            <option value="">-- Sila Pilih Syarikat --</option>
          </select>
        </div>
        <div id="rateInfoBadge" class="text-xs text-slate-500 bg-slate-50 border px-3 py-2 rounded-xl hidden">
          Kadar Gudang Standard: <span id="whRatesText" class="font-semibold text-slate-700"></span>
        </div>
      </div>

      <!-- Jadual Dinamik SKU -->
      <div id="tableContainer" class="hidden bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs text-slate-700 border-collapse">
            <thead id="skuTableHead" class="bg-slate-50 border-b border-slate-200 text-slate-600 uppercase text-[11px] tracking-wider font-semibold">
            </thead>
            <tbody id="skuTableBody" class="divide-y divide-slate-100">
            </tbody>
          </table>
        </div>
      </div>

      <!-- Ruang Catatan & Pengesahan Konsensus -->
      <div id="consensusSection" class="hidden bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
        <div>
          <h3 class="text-sm font-bold text-slate-800 mb-2">Catatan / Justifikasi Panel</h3>
          <textarea id="globalRemarks" rows="2" placeholder="Masukkan catatan umum bagi cadangan syarikat ini..." class="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50"></textarea>
        </div>

        <div class="border-t pt-5">
          <div class="flex justify-between items-center mb-3">
            <div>
              <h4 class="text-sm font-bold text-slate-800">Status Pengesahan Panel (Consensus Sign-Off)</h4>
              <p class="text-xs text-slate-500">Tanda persetujuan muktamad panel terhadap cadangan harga.</p>
            </div>
            <button type="button" id="btnEndorse" onclick="window.toggleEndorsement()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-4 py-2 rounded-xl transition shadow cursor-pointer">
              Sahkan & Setuju
            </button>
          </div>
          <div id="endorsementList" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
        </div>

        <div class="border-t pt-5">
          <h4 class="text-sm font-bold text-slate-800 mb-3">Rujukan Cadangan & Undian Ahli Panel Lain</h4>
          <div id="peerProposalsContainer" class="space-y-2"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = "https://onkvqmswvlmlyufwtyiy.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ua3ZxbXN3dmxtbHl1Znd0eWl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NjEyMjUsImV4cCI6MjEwNzAzNzIyNX0.fjg2UO1-Z8yF8__8z7d_qRJhrnuVoQnBWO8hnyEuulo";

    let sbClient = null;
    let currentUser = null;
    let warehouseRates = null;
    let logisticsList = [];
    let skuListCache = [];
    let skuStateMap = {};

    function initClient() {
      if (window.supabase && typeof window.supabase.createClient === "function") {
        sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    }
    initClient();

    window.showAlert = function(text, isError = true) {
      const box = document.getElementById("alertBox");
      if (!box) return;
      box.className = isError 
        ? "mb-4 p-3 rounded-lg text-xs font-medium bg-red-50 text-red-700 border border-red-200 block"
        : "mb-4 p-3 rounded-lg text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200 block";
      box.innerText = text;
    };

    window.togglePasswordVisibility = function() {
      const p = document.getElementById("passwordInput");
      const ico = document.getElementById("eyeIcon");
      if (p.type === "password") {
        p.type = "text";
        ico.innerText = "🙈";
      } else {
        p.type = "password";
        ico.innerText = "👁️";
      }
    };

    window.handleLogin = async function() {
      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value.trim();
      const btn = document.getElementById("btnLogin");

      if (!email || !password) return window.showAlert("Sila masukkan emel dan kata laluan.");
      if (!sbClient) initClient();

      btn.innerText = "Memproses...";
      btn.disabled = true;

      try {
        const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
        btn.innerText = "Log Masuk";
        btn.disabled = false;

        if (error) return window.showAlert("Gagal log masuk: " + error.message);
        currentUser = data.user;
        window.showDashboard();
      } catch (err) {
        btn.innerText = "Log Masuk";
        btn.disabled = false;
        window.showAlert("Ralat sistem: " + (err.message || err));
      }
    };

    window.handleLogout = async function() {
      if (sbClient) await sbClient.auth.signOut();
      window.location.reload();
    };

    window.showDashboard = async function() {
      document.getElementById("loginSection").classList.add("hidden");
      document.getElementById("dashboardSection").classList.remove("hidden");
      document.getElementById("userBadge").innerText = currentUser.email;

      await window.loadMasterRates();
      await window.fetchCompanies();
    };

    window.loadMasterRates = async function() {
      const { data: wh } = await sbClient.from("sku_inventory_costs").select("*").limit(1).maybeSingle();
      warehouseRates = wh || { handling_in_pallet: 0, handling_out_pallet: 0, handling_out_carton: 0, storage_cost: 0 };
      
      const rateBadge = document.getElementById("rateInfoBadge");
      const rateText = document.getElementById("whRatesText");
      if (rateBadge && rateText) {
        rateBadge.classList.remove("hidden");
        rateText.innerText = `In: RM${Number(warehouseRates.handling_in_pallet).toFixed(2)}/plt | Storage: RM${Number(warehouseRates.storage_cost).toFixed(2)}/plt | Out (Plt): RM${Number(warehouseRates.handling_out_pallet).toFixed(2)}/plt | Out (Ctn): RM${Number(warehouseRates.handling_out_carton).toFixed(2)}/ctn`;
      }

      const { data: log } = await sbClient.from("sku_logistics_costs").select("*");
      logisticsList = log || [];
    };

    window.fetchCompanies = async function() {
      const { data } = await sbClient.from("sku_base_costs").select("company_name");
      const unique = [...new Set((data || []).map(d => d.company_name))];
      const select = document.getElementById("companySelect");
      select.innerHTML = '<option value="">-- Sila Pilih Syarikat --</option>';
      unique.forEach(c => select.innerHTML += `<option value="${c}">${c}</option>`);
    };

    window.onCompanySelectChange = async function() {
      const company = document.getElementById("companySelect").value;
      const tableContainer = document.getElementById("tableContainer");
      const consensusSec = document.getElementById("consensusSection");

      if (!company) {
        tableContainer.classList.add("hidden");
        consensusSec.classList.add("hidden");
        skuListCache = [];
        return;
      }

      tableContainer.classList.remove("hidden");
      consensusSec.classList.remove("hidden");

      const { data: skus } = await sbClient.from("sku_base_costs").select("*").eq("company_name", company);
      skuListCache = skus || [];
      skuStateMap = {};

      const states = [...new Set(logisticsList.map(l => l.state))];

      skuListCache.forEach(sku => {
        skuStateMap[sku.sku_code] = {
          cost_price: Number(sku.cost_price) || 0,
          pallet_size: Number(sku.pallet_size) > 0 ? Number(sku.pallet_size) : 1,
          is_warehouse: false,
          state: states[0] || "",
          area: "",
          delivery_rate: 0,
          cost_pallet: Number(sku.cost_price) || 0,
          cost_carton: Number(sku.cost_price) || 0,
          margin_direct: 0,
          margin_pallet: 0,
          margin_carton: 0,
          proposed_price: 0
        };
      });

      window.renderTable();
      await window.loadCompanyEndorsements(company);
      await window.loadPeerProposals(company);
    };

    window.renderTable = function() {
      const thead = document.getElementById("skuTableHead");
      const tbody = document.getElementById("skuTableBody");
      const anyWarehouseChecked = Object.values(skuStateMap).some(item => item.is_warehouse);

      if (!anyWarehouseChecked) {
        thead.innerHTML = `
          <tr>
            <th class="p-3.5">Kod SKU</th>
            <th class="p-3.5">Nama SKU</th>
            <th class="p-3.5 text-right">Kos / Karton (RM)</th>
            <th class="p-3.5 text-center">Masuk Gudang</th>
            <th class="p-3.5 text-right">Margin (%)</th>
            <th class="p-3.5">Cadangan Harga Jual / Karton (RM)</th>
            <th class="p-3.5 text-center">Tindakan</th>
          </tr>
        `;
      } else {
        thead.innerHTML = `
          <tr>
            <th class="p-3.5">Kod SKU</th>
            <th class="p-3.5">Nama SKU</th>
            <th class="p-3.5 text-right">Kos Asal / Karton (RM)</th>
            <th class="p-3.5 text-center">Masuk Gudang</th>
            <th class="p-3.5 text-right bg-blue-50/50">Kos Keluar Pallet / Karton (RM)</th>
            <th class="p-3.5 text-right bg-indigo-50/50">Kos Keluar Karton / Karton (RM)</th>
            <th class="p-3.5">Negeri Destinasi</th>
            <th class="p-3.5">Lokasi Destinasi</th>
            <th class="p-3.5">Cadangan Harga Jual / Karton (RM)</th>
            <th class="p-3.5 text-right bg-blue-50/50">Margin Keluar Pallet (%)</th>
            <th class="p-3.5 text-right bg-indigo-50/50">Margin Keluar Karton (%)</th>
            <th class="p-3.5 text-center">Tindakan</th>
          </tr>
        `;
      }

      tbody.innerHTML = "";
      const states = [...new Set(logisticsList.map(l => l.state))];

      skuListCache.forEach(sku => {
        const stateData = skuStateMap[sku.sku_code];
        const row = document.createElement("tr");
        row.className = "hover:bg-slate-50 transition border-b border-slate-100";
        row.id = `row-${sku.sku_code}`;

        const isChecked = stateData.is_warehouse ? "checked" : "";
        const priceVal = stateData.proposed_price > 0 ? stateData.proposed_price : "";

        if (!anyWarehouseChecked) {
          row.innerHTML = `
            <td class="p-3.5 font-bold text-blue-600">${sku.sku_code}</td>
            <td class="p-3.5 font-medium text-slate-800 max-w-[220px] truncate" title="${sku.sku_name}">
              ${sku.sku_name}
              <span class="block text-[10px] text-slate-400 font-normal">Saiz Pallet: ${stateData.pallet_size} ctn/plt</span>
            </td>
            <td class="p-3.5 text-right font-semibold">RM ${stateData.cost_price.toFixed(2)}</td>
            <td class="p-3.5 text-center">
              <input type="checkbox" id="wh-${sku.sku_code}" onchange="window.toggleWarehouse('${sku.sku_code}')" ${isChecked} class="w-4 h-4 text-blue-600 rounded cursor-pointer" />
            </td>
            <td class="p-3.5 text-right font-bold" id="margin-direct-${sku.sku_code}">${stateData.margin_direct.toFixed(1)}%</td>
            <td class="p-3.5">
              <input type="number" step="0.01" id="price-${sku.sku_code}" value="${priceVal}" oninput="window.recalculate('${sku.sku_code}')" placeholder="0.00" class="border rounded-lg p-1.5 text-xs w-28 font-semibold text-right outline-none focus:ring-2 focus:ring-blue-500" />
            </td>
            <td class="p-3.5 text-center">
              <button onclick="window.saveSkuProposal('${sku.sku_code}')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition cursor-pointer shadow-sm">
                Simpan
              </button>
            </td>
          `;
        } else {
          const stateOptions = states.map(s => `<option value="${s}" ${s === stateData.state ? 'selected' : ''}>${s}</option>`).join("");
          const filteredAreas = logisticsList.filter(l => l.state === stateData.state);
          const areaOptions = filteredAreas.map(a => `<option value="${a.area}" data-rate="${a.delivery_rate}" ${a.area === stateData.area ? 'selected' : ''}>${a.area} (RM${Number(a.delivery_rate).toFixed(2)})</option>`).join("");

          row.innerHTML = `
            <td class="p-3.5 font-bold text-blue-600">${sku.sku_code}</td>
            <td class="p-3.5 font-medium text-slate-800 max-w-[190px] truncate" title="${sku.sku_name}">
              ${sku.sku_name}
              <span class="block text-[10px] text-slate-400 font-normal">Saiz Pallet: ${stateData.pallet_size} ctn/plt</span>
            </td>
            <td class="p-3.5 text-right font-semibold">RM ${stateData.cost_price.toFixed(2)}</td>
            <td class="p-3.5 text-center">
              <input type="checkbox" id="wh-${sku.sku_code}" onchange="window.toggleWarehouse('${sku.sku_code}')" ${isChecked} class="w-4 h-4 text-blue-600 rounded cursor-pointer" />
            </td>
            <td class="p-3.5 text-right font-bold text-blue-700 bg-blue-50/30" id="cost-pallet-${sku.sku_code}">RM ${stateData.cost_pallet.toFixed(2)}</td>
            <td class="p-3.5 text-right font-bold text-indigo-700 bg-indigo-50/30" id="cost-carton-${sku.sku_code}">RM ${stateData.cost_carton.toFixed(2)}</td>
            <td class="p-3.5">
              <select id="state-${sku.sku_code}" onchange="window.onStateChange('${sku.sku_code}')" class="border rounded-lg p-1.5 text-xs bg-white outline-none">
                ${stateOptions}
              </select>
            </td>
            <td class="p-3.5">
              <select id="area-${sku.sku_code}" onchange="window.onAreaChange('${sku.sku_code}')" class="border rounded-lg p-1.5 text-xs bg-white outline-none min-w-[130px]">
                ${areaOptions}
              </select>
            </td>
            <td class="p-3.5">
              <input type="number" step="0.01" id="price-${sku.sku_code}" value="${priceVal}" oninput="window.recalculate('${sku.sku_code}')" placeholder="0.00" class="border rounded-lg p-1.5 text-xs w-28 font-semibold text-right outline-none focus:ring-2 focus:ring-blue-500" />
            </td>
            <td class="p-3.5 text-right font-bold bg-blue-50/30" id="margin-pallet-${sku.sku_code}">${stateData.margin_pallet.toFixed(1)}%</td>
            <td class="p-3.5 text-right font-bold bg-indigo-50/30" id="margin-carton-${sku.sku_code}">${stateData.margin_carton.toFixed(1)}%</td>
            <td class="p-3.5 text-center">
              <button onclick="window.saveSkuProposal('${sku.sku_code}')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition cursor-pointer shadow-sm">
                Simpan
              </button>
            </td>
          `;
        }
        tbody.appendChild(row);

        if (stateData.is_warehouse && !stateData.area) {
          window.onStateChange(sku.sku_code, false);
        }
        window.recalculate(sku.sku_code);
      });
    };

    window.toggleWarehouse = function(skuCode) {
      const checkbox = document.getElementById(`wh-${skuCode}`);
      skuStateMap[skuCode].is_warehouse = checkbox.checked;
      window.renderTable();
    };

    window.onStateChange = function(skuCode, triggerRecalc = true) {
      const stateSelect = document.getElementById(`state-${skuCode}`);
      const areaSelect = document.getElementById(`area-${skuCode}`);
      if (!stateSelect || !areaSelect) return;

      const selectedState = stateSelect.value;
      skuStateMap[skuCode].state = selectedState;

      const filteredAreas = logisticsList.filter(l => l.state === selectedState);
      areaSelect.innerHTML = filteredAreas.map(a => `<option value="${a.area}" data-rate="${a.delivery_rate}">${a.area} (RM${Number(a.delivery_rate).toFixed(2)})</option>`).join("");

      if (filteredAreas.length > 0) {
        skuStateMap[skuCode].area = filteredAreas[0].area;
        skuStateMap[skuCode].delivery_rate = Number(filteredAreas[0].delivery_rate) || 0;
      } else {
        skuStateMap[skuCode].area = "";
        skuStateMap[skuCode].delivery_rate = 0;
      }

      if (triggerRecalc) window.recalculate(skuCode);
    };

    window.onAreaChange = function(skuCode) {
      const areaSelect = document.getElementById(`area-${skuCode}`);
      if (!areaSelect) return;
      const opt = areaSelect.options[areaSelect.selectedIndex];
      skuStateMap[skuCode].area = opt ? opt.value : "";
      skuStateMap[skuCode].delivery_rate = opt ? parseFloat(opt.getAttribute("data-rate")) || 0 : 0;
      window.recalculate(skuCode);
    };

    window.recalculate = function(skuCode) {
      const stateData = skuStateMap[skuCode];
      if (!stateData) return;

      const priceInput = document.getElementById(`price-${skuCode}`);
      const price = priceInput ? parseFloat(priceInput.value) || 0 : 0;
      stateData.proposed_price = price;

      if (!stateData.is_warehouse) {
        // Direct Ship: Kos asas sekarton sahaja
        const costDirect = stateData.cost_price;
        let margin = 0;
        if (price > 0) {
          margin = ((price - costDirect) / price) * 100;
        }
        stateData.margin_direct = margin;

        const marginEl = document.getElementById(`margin-direct-${skuCode}`);
        if (marginEl) {
          marginEl.innerText = `${margin.toFixed(1)}%`;
          marginEl.className = margin >= 15 ? "p-3.5 text-right font-bold text-emerald-600" : (margin > 0 ? "p-3.5 text-right font-bold text-amber-600" : "p-3.5 text-right font-bold text-red-500");
        }
      } else {
        // Masuk Gudang: Pengiraan berasaskan unit sekarton
        const areaSelect = document.getElementById(`area-${skuCode}`);
        const selectedOpt = areaSelect ? areaSelect.options[areaSelect.selectedIndex] : null;
        const deliveryRate = selectedOpt ? parseFloat(selectedOpt.getAttribute("data-rate")) || 0 : stateData.delivery_rate;

        const palletSize = stateData.pallet_size;

        // Kos Gudang Sekarton
        const inCostPerCtn = (Number(warehouseRates.handling_in_pallet) || 0) / palletSize;
        const storageCostPerCtn = (Number(warehouseRates.storage_cost) || 0) / palletSize;
        const baseWhPerCtn = inCostPerCtn + storageCostPerCtn;

        const outPalletPerCtn = (Number(warehouseRates.handling_out_pallet) || 0) / palletSize;
        const outCartonPerCtn = Number(warehouseRates.handling_out_carton) || 0;

        // Kos Landed Lengkap Sekarton
        const costPallet = stateData.cost_price + baseWhPerCtn + outPalletPerCtn + deliveryRate;
        const costCarton = stateData.cost_price + baseWhPerCtn + outCartonPerCtn + deliveryRate;

        let marginPallet = 0;
        let marginCarton = 0;
        if (price > 0) {
          marginPallet = ((price - costPallet) / price) * 100;
          marginCarton = ((price - costCarton) / price) * 100;
        }

        stateData.cost_pallet = costPallet;
        stateData.cost_carton = costCarton;
        stateData.margin_pallet = marginPallet;
        stateData.margin_carton = marginCarton;

        const elCostPallet = document.getElementById(`cost-pallet-${skuCode}`);
        const elCostCarton = document.getElementById(`cost-carton-${skuCode}`);
        const elMarginPallet = document.getElementById(`margin-pallet-${skuCode}`);
        const elMarginCarton = document.getElementById(`margin-carton-${skuCode}`);

        if (elCostPallet) elCostPallet.innerText = `RM ${costPallet.toFixed(2)}`;
        if (elCostCarton) elCostCarton.innerText = `RM ${costCarton.toFixed(2)}`;
        
        if (elMarginPallet) {
          elMarginPallet.innerText = `${marginPallet.toFixed(1)}%`;
          elMarginPallet.className = marginPallet >= 15 ? "p-3.5 text-right font-bold text-emerald-600 bg-blue-50/30" : (marginPallet > 0 ? "p-3.5 text-right font-bold text-amber-600 bg-blue-50/30" : "p-3.5 text-right font-bold text-red-500 bg-blue-50/30");
        }
        if (elMarginCarton) {
          elMarginCarton.innerText = `${marginCarton.toFixed(1)}%`;
          elMarginCarton.className = marginCarton >= 15 ? "p-3.5 text-right font-bold text-emerald-600 bg-indigo-50/30" : (marginCarton > 0 ? "p-3.5 text-right font-bold text-amber-600 bg-indigo-50/30" : "p-3.5 text-right font-bold text-red-500 bg-indigo-50/30");
        }
      }
    };

    window.saveSkuProposal = async function(skuCode) {
      const stateData = skuStateMap[skuCode];
      const note = document.getElementById("globalRemarks").value.trim();

      if (!stateData.proposed_price || stateData.proposed_price <= 0) {
        return alert("Sila masukkan nilai Cadangan Harga Jual / Karton terlebih dahulu.");
      }

      const payload = {
        sku_code: skuCode,
        proposed_by: currentUser.id,
        proposed_price: stateData.proposed_price,
        is_warehouse: stateData.is_warehouse,
        target_state: stateData.is_warehouse ? stateData.state : 'Direct Ship',
        target_area: stateData.is_warehouse ? stateData.area : 'Direct Ship',
        target_zone: stateData.is_warehouse ? `${stateData.state} - ${stateData.area}` : 'Direct Ship',
        total_cost: stateData.is_warehouse ? stateData.cost_carton : stateData.cost_price,
        total_cost_pallet: stateData.is_warehouse ? stateData.cost_pallet : stateData.cost_price,
        total_cost_carton: stateData.is_warehouse ? stateData.cost_carton : stateData.cost_price,
        margin_pct: stateData.is_warehouse ? stateData.margin_carton : stateData.margin_direct,
        margin_pallet: stateData.is_warehouse ? stateData.margin_pallet : stateData.margin_direct,
        margin_carton: stateData.is_warehouse ? stateData.margin_carton : stateData.margin_direct,
        justification: note
      };

      const { error } = await sbClient.from("price_proposals").insert(payload);
      if (error) return alert("Ralat menyimpan cadangan: " + error.message);

      alert(`Cadangan harga sekarton bagi ${skuCode} berjaya disimpan!`);
      const company = document.getElementById("companySelect").value;
      await window.loadPeerProposals(company);
    };

    window.loadPeerProposals = async function(company) {
      const container = document.getElementById("peerProposalsContainer");
      container.innerHTML = '<p class="text-xs text-slate-400">Memuatkan cadangan ahli...</p>';

      const { data: skus } = await sbClient.from("sku_base_costs").select("sku_code").eq("company_name", company);
      const skuCodes = (skus || []).map(s => s.sku_code);

      const { data: proposals } = await sbClient
        .from("price_proposals")
        .select("*, proposal_votes(*)")
        .in("sku_code", skuCodes)
        .order("created_at", { ascending: false });

      if (!proposals || proposals.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 italic">Belum ada cadangan dimasukkan oleh ahli panel lain.</p>';
        return;
      }

      container.innerHTML = proposals.map(p => {
        const hasVoted = p.proposal_votes && p.proposal_votes.some(v => v.user_id === currentUser.id);
        const votes = p.proposal_votes ? p.proposal_votes.length : 0;
        return `
          <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border text-xs">
            <div>
              <span class="font-bold text-blue-600 mr-2">${p.sku_code}</span>
              <span class="font-bold text-slate-800 text-sm">RM ${Number(p.proposed_price).toFixed(2)} /ctn</span>
              <span class="text-slate-500 ml-2">(${p.is_warehouse ? p.target_zone : 'Direct Ship'})</span>
              <span class="ml-2 text-slate-400">Margin Pallet: ${Number(p.margin_pallet || 0).toFixed(1)}% | Margin Karton: ${Number(p.margin_carton || 0).toFixed(1)}%</span>
              ${p.justification ? `<p class="text-slate-500 mt-1 italic">Catatan: "${p.justification}"</p>` : ''}
            </div>
            <div class="flex items-center gap-3">
              <span class="font-bold text-slate-600">${votes} Sokongan</span>
              <button onclick="window.toggleVote('${p.id}', ${hasVoted})" class="px-3 py-1.5 rounded-lg font-medium transition cursor-pointer ${hasVoted ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-700 hover:bg-slate-300'}">
                ${hasVoted ? 'Disokong ✓' : 'Sokong'}
              </button>
            </div>
          </div>
        `;
      }).join("");
    };

    window.toggleVote = async function(proposalId, hasVoted) {
      if (hasVoted) {
        await sbClient.from("proposal_votes").delete().match({ proposal_id: proposalId, user_id: currentUser.id });
      } else {
        await sbClient.from("proposal_votes").insert({ proposal_id: proposalId, user_id: currentUser.id });
      }
      const company = document.getElementById("companySelect").value;
      window.loadPeerProposals(company);
    };

    window.loadCompanyEndorsements = async function(company) {
      const container = document.getElementById("endorsementList");
      const btnEndorse = document.getElementById("btnEndorse");

      const { data: endorsements } = await sbClient.from("pricing_endorsements").select("*").eq("company_name", company);
      const list = endorsements || [];

      const hasEndorsed = list.some(e => e.user_id === currentUser.id);
      btnEndorse.innerText = hasEndorsed ? "Tarik Semula Persetujuan" : "Sahkan & Setuju";
      btnEndorse.className = hasEndorsed 
        ? "bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 text-xs font-semibold px-4 py-2 rounded-xl transition cursor-pointer"
        : "bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-4 py-2 rounded-xl transition shadow cursor-pointer";

      if (list.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 italic col-span-3">Belum ada pengesahan dibuat bagi syarikat ini.</p>';
        return;
      }

      container.innerHTML = list.map(e => `
        <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl flex items-center gap-2">
          <span class="text-emerald-600 font-bold">✓</span>
          <div>
            <p class="text-xs font-bold text-slate-800">${e.user_email}</p>
            <p class="text-[10px] text-slate-500">${new Date(e.created_at).toLocaleString('ms-MY')}</p>
          </div>
        </div>
      `).join("");
    };

    window.toggleEndorsement = async function() {
      const company = document.getElementById("companySelect").value;
      if (!company) return;

      const { data } = await sbClient.from("pricing_endorsements").select("id").eq("company_name", company).eq("user_id", currentUser.id).maybeSingle();

      if (data) {
        await sbClient.from("pricing_endorsements").delete().eq("id", data.id);
      } else {
        await sbClient.from("pricing_endorsements").insert({
          company_name: company,
          user_id: currentUser.id,
          user_email: currentUser.email,
          remarks: document.getElementById("globalRemarks").value.trim()
        });
      }
      window.loadCompanyEndorsements(company);
    };

    window.addEventListener("DOMContentLoaded", () => {
      initClient();
      if (sbClient) {
        sbClient.auth.getSession().then(({ data: { session } }) => {
          if (session) {
            currentUser = session.user;
            window.showDashboard();
          }
        });
      }
    });
  </script>
</body>
</html>
